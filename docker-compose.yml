name: xtractor

services:
  app:
    image: fleet-security/xtractor-app:20261021-node26
    labels:
      - "autoheal=true"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=https://xtractor.inakilozano.com
    ports:
      - "127.0.0.1:3460:3000"
    env_file:
      - .env.local
    environment:
      - SCRAPER_URL=http://scraper:8000
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_healthy
    networks:
      - xtractor-net
    volumes:
      - artifacts:/app/artifacts
    restart: unless-stopped
    cpus: "1"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
          pids: 512

  postgres:
    image: fleet-security/pg16-alpine:20261021
    env_file:
      - .env.local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    networks:
      - xtractor-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
          pids: 256

  scraper:
    image: fleet-security/xtractor-scraper:20261021-python315
    init: true
    build:
      context: ./scraper
      dockerfile: Dockerfile
    env_file:
      - .env.local
    volumes:
      - artifacts:/app/artifacts
    networks:
      - xtractor-net
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -m 3 http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
          pids: 256

networks:
  xtractor-net:
    driver: bridge

volumes:
  pgdata:
  artifacts:
